<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新山海湾永久地契公寓 · Wee Nun</title>
    <!-- 引入你的样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 这里的 HTML 结构会自动去读取并渲染你的户型数据 -->
    <div class="wrap">
        <header>
            <div class="brand"><span>WN</span><small>WEE NUN<br>PROPERTY</small></div>
            <nav>
                <a href="#video">海景视频</a>
                <a href="#units-section">户型</a>
                <a class="navcta" href="https://wa.me" target="_blank">WhatsApp 咨询</a>
            </nav>
        </header>

        <!-- 海景视频区域 -->
        <section id="video" class="sea-section" style="padding-top:120px;">
            <div class="sectionhead">
                <h2>看看海景什么样子先</h2>
                <p>按播放，感受窗外的海湾景色。</p>
            </div>
            <div class="video-quality">
                <label for="video-quality">播放画质：</label>
                <select id="video-quality">
                    <option value="hd">高清 · 1080p</option>
                    <option value="4k">4K · 2160p</option>
                </select>
            </div>
            <video id="sea-video" controls poster="assets/A2.webp">
                <source src="assets/seaview-v2-hd.mp4" type="video/mp4">
                你的浏览器不支持视频播放。
            </video>
            <p class="sea-note">此视频为景观参考，实际景观因楼栋、楼层及朝向而异。</p>
        </section>

        <!-- 户型筛选与展示区域 -->
        <section id="units-section" class="homes">
            <div class="sectionhead">
                <div>
                    <span class="eyebrow">02 / FIND YOUR SPACE</span>
                    <h2>先选生活，再选户型。</h2>
                </div>
                <div class="filters">
                    <button data-filter="0" class="active">全部户型</button>
                    <button data-filter="1">一房</button>
                    <button data-filter="2">两房</button>
                    <button data-filter="3">两房＋书房</button>
                </div>
            </div>
            <div id="count">正在加载户型...</div>
            <div id="units" class="unitgrid"></div>
        </section>
    </div>

    <!-- 放大查看的弹窗 -->
    <dialog id="viewer">
        <button id="close">关闭 ×</button>
        <h3 id="viewtitle">户型图</h3>
        <img id="viewimg" src="" alt="平面图">
        <p>平面图仅供参考，尺寸以最终确认资料为准。</p>
    </dialog>

    <!-- 底部悬浮 WhatsApp -->
    <a class="floatwa" href="https://wa.me" target="_blank">
        <img class="floatwa-avatar" src="assets/A2.webp" alt="Wee Nun">
        <span>WhatsApp 联系 Wee Nun</span>
    </a>

    <!-- 🌟 这里是核心：引入你的逻辑代码，让网页活起来 -->
    <script src="app.js"></script>
</body>
</html>
